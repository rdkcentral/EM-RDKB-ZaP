controller:
    ui_port: 8888                                           # Port used by the Controller web UI
    ui_home_page_title: 'EasyMesh R6 Pro Controller'        # Title displayed on the Controller web UI
    bridge_iface: 'brlan0'                                  # LAN bridge interface used by the Controller
    bridge_ip: <ip_address>                                  # IP address of the Controller bridge interface
    backhaul_capture_iface: 'eth0_virt_peer'                # Interface used for capturing backhaul traffic
    filter_1905: 'ether proto 0x893a'                       # Packet capture filter for IEEE 1905 traffic
    wifi_device: 'radio'                                    # Wi-Fi device identifier used by the framework
    wifi_iface: 'default_radio{}'                           # Wi-Fi interface naming pattern
    wifi_ifname: 'wifi'                                     # Base name of the Wi-Fi interface
    wifi_phy_ifname: 'phy'                                  # Base name of the Wi-Fi PHY interface
    mld_ifname: 'mld'                                       # Multi-Link Device interface name
    iperf_version: 3                                        # iperf version used for traffic testing
    default_ssid: private_ssid                              # Default Wi-Fi SSID
    passphrase_1: CHANGEME                                  # First Wi-Fi security passphrase
    passphrase_2: CHANGEME1                                 # Second Wi-Fi security passphrase
    controller_device_index: 1                              # Controller Device index
    extender1_device_index: 2                               # Extender 1 Device index
    extender2_device_index: 3                               # Extender 2 Device index
    2g_ssid_index: 1                                        # 2.4 GHz ssid index
    2g_radio_index: 1                                       # 2.4 GHz Radio index
    5g_radio_index: 2                                       # 5 GHz Radio index
    6g_radio_index: 3                                       # 6 GHz Radio index
    2g_radio_bss_index: 1                                   # Dynamically discovered 2.4 GHz BSS index
    2g_radio_vap1_bss_index: 2                              # Dynamically discovered BSS index for 2g_radio_vap1_mac
    2g_radio_vap2_bss_index: 3                              # Dynamically discovered BSS index for 2g_radio_vap2_mac
    5g_radio_bss_index: 4                                   # Dynamically discovered 5 GHz BSS index
    5g_radio_vap1_bss_index: 5                              # Dynamically discovered BSS index for 5g_radio_vap1_mac
    5g_radio_vap2_bss_index: 6                              # Dynamically discovered BSS index for 5g_radio_vap2_mac
    5g_radio_vap3_bss_index: 7                              # Dynamically discovered BSS index for 5g_radio_vap3_mac
    6g_radio_bss_index: 8                                   # Dynamically discovered 6 GHz BSS index
    6g_radio_vap1_bss_index: 9                              # Dynamically discovered BSS index for 6g_radio_vap1_mac
    6g_radio_vap2_bss_index: 10                             # Dynamically discovered BSS index for 6g_radio_vap2_mac
    mld_iface_index: 0                                      # MLD interface index
    gateway_ip_index: 4                                     # Gateway IP index
    sta_index: 1                                            # Station index
    ip_index: 1                                             # IP index
    2g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 2.4 GHz radio MAC address
    5g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 5 GHz radio MAC address
    6g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 6 GHz radio MAC address
         
extender1:
    bridge_iface: 'brlan0'                                  # LAN bridge interface used by Extender 1
    bridge_ip: <ip_address>                                 # IP address of Extender 1 bridge interface
    wifi_ifname: 'wifi'                                     # Base Wi-Fi interface name on Extender 1
    backhaul_iface_index: <wifi.1.1.sta(n)>                 # Backhaul interface index
    mld_ifname: 'mld'                                       # MLD interface name on Extender 1
    mld_iface_index: 0                                      # MLD interface index on Extender 1
    iperf_version: 3                                        # iperf version used by Extender 1
    2g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 2.4 GHz radio MAC address
    5g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 5 GHz radio MAC address
    6g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 6 GHz radio MAC address
        
extender2:    
    bridge_iface: 'brlan0'                                  # LAN bridge interface used by Extender 2
    bridge_ip: <ip_address>                                 # IP address of Extender 2 bridge interface
    wifi_ifname: 'wifi'                                     # Base Wi-Fi interface name on Extender 2
    backhaul_iface_index2: <wifi.1.1.sta(n)>                # Backhaul interface index
    mld_ifname: 'mld'                                       # MLD interface name on Extender 2
    mld_iface_index: 0                                      # MLD interface index on Extender 2
    iperf_version: 3                                        # iperf version used by Extender 2
    2g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 2.4 GHz radio MAC address
    5g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 5 GHz radio MAC address
    6g_radio_mac: aa:bb:cc:dd:ee:ff                          # Dynamically discovered 6 GHz radio MAC address  
     
extender3:    
    bridge_iface: 'brlan0'                                  # LAN bridge interface used by Extender 3
    bridge_ip: <ip_address>                                  # IP address of Extender 3 bridge interface
    wifi_ifname: 'wifi'                                     # Base Wi-Fi interface name on Extender 3
    backhaul_iface_index3: <wifi.1.1.sta(n)>                # Backhaul interface index
    mld_ifname: 'mld'                                       # MLD interface name on Extender 3
    mld_iface_index: 0                                      # MLD interface index on Extender 3
    iperf_version: 3                                        # iperf version used by Extender 3
    2g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 2.4 GHz radio MAC address
    5g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 5 GHz radio MAC address
    6g_radio_mac: aa:bb:cc:dd:ee:ff                         # Dynamically discovered 6 GHz radio MAC address
    
protocol:
    common_protocol_validation: True                        # Enable/Disable common protocol validation for verifying protocol-level behavior and message exchanges
test_parameters:
    controller_recovery_kpi_seconds: 300                    # Controller Recovery KPI threshold in seconds
