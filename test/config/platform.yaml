controller:
    ui_port: 8888                                           # Port used by the Controller web UI
    ui_home_page_title: 'EasyMesh R6 Pro Controller'        # Title displayed on the Controller web UI
    bridge_iface: 'brlan0'                                  # LAN bridge interface used by the Controller
    bridge_ip: <ip_address>                                     # IP address of the Controller bridge interface
    backhaul_capture_iface: 'eth0_virt_peer'                # Interface used for capturing backhaul traffic
    filter_1905: 'ether proto 0x893a'                       # Packet capture filter for IEEE 1905 traffic
    wifi_device: 'radio'                                    # Wi-Fi device identifier used by the framework
    wifi_iface: 'default_radio{}'                           # Wi-Fi interface naming pattern
    wifi_ifname: 'wifi'                                     # Base name of the Wi-Fi interface
    wifi_phy_ifname: 'phy'                                  # Base name of the Wi-Fi PHY interface
    mld_ifname: 'mld'                                       # Multi-Link Device interface name
    iperf_version: 3                                        # iperf version used for traffic testing
    default_ssid: private_ssid                              # Default Wi-Fi SSID
    passphrase_1: CHANGEME                                  # First Wi-Fi security passphrase
    passphrase_2: CHANGEME1                                 # Second Wi-Fi security passphrase
    # Expected Controller radio and BSS MAC addresses used to dynamically discover DataElements indexes
    2g_radio_mac: 02:02:10:9b:5d:27                         # Expected 2.4 GHz radio MAC address
    2g_radio_vap1_mac: 02:02:11:9b:5d:2a                    # Expected 2.4 GHz BSS 1 MAC address
    2g_radio_vap2_mac: 02:02:12:9b:5d:2b                    # Expected 2.4 GHz BSS 2 MAC address
    5g_radio_mac: 02:02:20:9b:5d:28                         # Expected 5 GHz radio MAC address
    5g_radio_vap1_mac: 02:02:21:9b:5d:2c                    # Expected 5 GHz BSS 1 MAC address
    5g_radio_vap2_mac: 02:02:22:9b:5d:2d                    # Expected 5 GHz BSS 2 MAC address
    5g_radio_vap3_mac: 02:02:23:9b:5d:2e                    # Expected 5 GHz BSS 3 MAC address
    6g_radio_mac: 02:02:30:9b:5d:29                         # Expected 6 GHz radio MAC address
    6g_radio_vap1_mac: 02:02:31:9b:5d:2f                    # Expected 6 GHz BSS 1 MAC address
    6g_radio_vap2_mac: 02:02:32:9b:5d:30                    # Expected 6 GHz BSS 2 MAC address
    mld0_mac: 02:02:30:9b:5d:2a                             # Expected MLD interface MAC address
    # Dynamic DataElements indexes - initialized to None and updated at runtime by discover_indexes()
    controller_device_index: None                           # Dynamically discovered Controller Device index
    extender1_device_index: None                            # Dynamically discovered Extender 1 Device index
    extender2_device_index: None                            # Dynamically discovered Extender 2 Device index
    extender3_device_index: None                            # Dynamically discovered Extender 3 Device index
    2g_radio_index: None                                    # Dynamically discovered 2.4 GHz Radio index
    5g_radio_index: None                                    # Dynamically discovered 5 GHz Radio index
    6g_radio_index: None                                    # Dynamically discovered 6 GHz Radio index
    2g_radio_bss_index: None                                # Dynamically discovered 2.4 GHz BSS index
    2g_radio_vap1_bss_index: None                           # Dynamically discovered BSS index for 2g_radio_vap1_mac
    2g_radio_vap2_bss_index: None                           # Dynamically discovered BSS index for 2g_radio_vap2_mac
    5g_radio_bss_index: None                                # Dynamically discovered 5 GHz BSS index
    5g_radio_vap1_bss_index: None                           # Dynamically discovered BSS index for 5g_radio_vap1_mac
    5g_radio_vap2_bss_index: None                           # Dynamically discovered BSS index for 5g_radio_vap2_mac
    5g_radio_vap3_bss_index: None                           # Dynamically discovered BSS index for 5g_radio_vap3_mac
    6g_radio_bss_index: None                                # Dynamically discovered 6 GHz BSS index
    6g_radio_vap1_bss_index: None                           # Dynamically discovered BSS index for 6g_radio_vap1_mac
    6g_radio_vap2_bss_index: None                           # Dynamically discovered BSS index for 6g_radio_vap2_mac
    mld_iface_index: 0                                      # MLD interface index
    backhaul_iface_index: 1.1.sta65                         # Backhaul interface index
    profile_index: 1                                        # Profile index
    sta_index: 1                                            # Station index
    ip_index: 1                                             # IP index
     

extender1:
    bridge_iface: 'brlan0'                                  # LAN bridge interface used by Extender 1
    bridge_ip: <ip_address>                                   # IP address of Extender 1 bridge interface
    wifi_ifname: 'wifi'                                     # Base Wi-Fi interface name on Extender 1
    mld_ifname: 'mld'                                       # MLD interface name on Extender 1
    mld_iface_index: 0                                      # MLD interface index on Extender 1
    iperf_version: 3                                        # iperf version used by Extender 1
    
    
